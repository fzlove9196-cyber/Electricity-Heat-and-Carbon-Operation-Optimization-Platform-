<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原文案例与独立审计</title><link rel="stylesheet" href="/static/style.css"><style>body{display:block;padding:22px;max-width:1250px;margin:auto}textarea{width:100%;font-family:monospace}pre{white-space:pre-wrap;max-height:450px;overflow:auto}.scroll{overflow:auto;max-height:500px}button,select{margin:5px}</style>
<h1>原文案例 / 福利与生命周期审计</h1><p><a href="/">← 原工作台（项目与历史不变）</a></p>
<p>显式新模式，不改变默认物理约束。这里只覆盖 Zhang 三节点7场景与 Zheng 无时序状态迁移政策；不宣称8篇完整复现。</p>
<label>原始输入 <select id="case"><option value="zhang_s1">Zhang 场景1</option><option value="zhang_s2">Zhang 场景2</option><option value="zhang_s3">Zhang 场景3</option><option value="zhang_s4">Zhang 场景4</option><option value="zhang_s5">Zhang 场景5</option><option value="zhang_s6">Zhang 场景6</option><option value="zhang_s7">Zhang 场景7</option><option value="zheng2019_annual">Zheng 2019 · 8760小时 / 546网格</option></select></label><button id="load">加载原输入</button><label>导入 JSON <input id="file" type="file" accept=".json"></label>
<details><summary>完整输入与参数（可编辑；不含最优接纳/迁移决策）</summary><textarea id="input" rows="16" aria-label="原文案例完整JSON"></textarea></details>
<p id="scope"></p><label>日调度目标 <select id="objective"><option value="welfare">welfare 福利出清</option><option value="cost">cost 原成本模式</option></select></label><label>网络域 <select id="domain"><option value="paper_abstract">paper_abstract 论文抽象（非物理安全）</option><option value="physical">physical 默认 ±π</option></select></label><label>迁移费 <select id="basis"><option value="net">net 净迁移</option><option value="gross">gross 双向总量</option></select></label><label><input type="checkbox" id="lifecycle">可选生命周期独立分账（日调度）</label>
<p>抽象模式只取消论文未定义的相角箱约束，仍保留功率平衡、线路容量、接纳和迁移约束；不做交流校核。日调度均调用现有正式 model/load → model/rerun → results → export.zip 接口。全年模式是固定容量网格的作者无状态优先政策（精确闭式 LP），不是投资/金融寻优或全年网络OPF。</p>
<button id="run">运行当前原始输入</button><span id="status" role="status"></span><div id="links"></div><h2>产品结果与审计</h2><pre id="summary"></pre><div id="table" class="scroll"></div>
<script>
const $=x=>document.getElementById(x); let result=null;
async function api(url,body){let r=await fetch(url,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error(await r.text());return r.json()}
async function load(){let b=await api('/api/paper-reproduction/cases/'+$('case').value);$('input').value=JSON.stringify(b,null,2);$('scope').textContent=b.note||b.source;$('summary').textContent='输入已加载，尚未运行';$('table').replaceChildren();$('links').replaceChildren()}
$('load').onclick=()=>load().catch(e=>$('status').textContent=e.message);$('file').onchange=async e=>{$('input').value=await e.target.files[0].text()};
function table(rows){let t=document.createElement('table');t.className='tbl';let keys=Object.keys(rows[0]||{});let tr=t.insertRow();keys.forEach(k=>{let c=document.createElement('th');c.textContent=k;tr.append(c)});rows.forEach(r=>{let tr=t.insertRow();keys.forEach(k=>{let td=tr.insertCell();td.textContent=typeof r[k]==='object'?JSON.stringify(r[k]):String(r[k]??'')})});$('table').replaceChildren(t)}
function link(text,url){let a=document.createElement('a');a.href=url;a.textContent=text;a.style.marginRight='20px';$('links').append(a)}
$('run').onclick=async()=>{let btn=$('run');btn.disabled=true;$('status').textContent='运行中…';$('links').replaceChildren();try{let b=JSON.parse($('input').value);
if(b.curtailment_mwh){result=await api('/api/paper-reproduction/annual-migration',b);let first=result.grid[b.hourly_case_index||0];$('summary').textContent=JSON.stringify({model:result.model,n_hours:result.n_hours,n_grid_points:result.n_grid_points,selected:first,scope_limits:result.scope_limits,input_hash:result.input_hash},null,2);table(result.grid);link('下载完整输入/546网格/8760逐时分账',result.export_url)}else{b.objective_mode=$('objective').value;b.network_domain=$('domain').value;b.migration_fee_basis=$('basis').value;b.lifecycle_enabled=$('lifecycle').checked;let sid='paperui'+crypto.randomUUID().replaceAll('-','').slice(0,16);await api('/api/sessions/'+sid+'/model/load',b);await api('/api/sessions/'+sid+'/model/rerun',{ac:false,baseline:false});result=await api('/api/sessions/'+sid+'/results');let a=result.audit.optimized;$('summary').textContent=JSON.stringify({market:a.market_clearing,welfare_per_hour:a.market_clearing.welfare_cny===null?null:a.market_clearing.welfare_cny/24,network:a.network_mapping,lifecycle:a.lifecycle_ledger,warnings:result.warnings},null,2);table(a.job_admission);link('下载正式全精度审计运行包','/api/sessions/'+sid+'/export.zip');link('正式结果API','/api/sessions/'+sid+'/results')}
$('status').textContent='运行完成；独立精度验收见报告（并非自动全篇通过）'}catch(e){$('status').textContent='未通过：'+e.message;$('summary').textContent=e.stack}finally{btn.disabled=false}};load().catch(e=>$('status').textContent=e.message);
</script></html>
